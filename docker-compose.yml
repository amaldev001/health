version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healthcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: healthcare_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/healthcare_db
      JWT_SECRET: supersecretjwtkeythatisatleast32characterslongforsecurity
      FRONTEND_ORIGIN: http://localhost:5000
      CLINIC_TIMEZONE: UTC
      CLINIC_NAME: Healthcare Clinic
      CLINIC_PHONE: "+1-800-555-0199"
      CLINIC_ADDRESS: "123 Medical Center Blvd"
      CLINIC_HOURS: "09:00-17:00"
      EMERGENCY_NUMBER: "911"
      CURRENCY: USD
      ADMIN_NAME: "System Admin"
      ADMIN_EMAIL: "admin@healthcare.com"
      ADMIN_PASSWORD: "AdminPassword123!"

volumes:
  mongo-data:
